name: Verify HVAC Connect
on:
  push:
    branches: [main, "sprint-*/*"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_local_auth:
        description: Run isolated Docker/Supabase authentication and booking tests
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/sprint-2/requests-and-messaging' }}
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  local-auth:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_local_auth) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/sprint-2/requests-and-messaging')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local Supabase
        run: |
          npx supabase start > /tmp/hvac-supabase-start.log 2>&1
          npx supabase status -o env > /tmp/hvac-supabase-env
      - name: Configure local test environment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const values = Object.fromEntries(readFileSync("/tmp/hvac-supabase-env", "utf8").split("\n").flatMap(line => {
            const match = line.match(/^([A-Z_]+)="?(.*?)"?$/);
            return match ? [[match[1], match[2]]] : [];
          }));
          const url = values.API_URL;
          const key = values.PUBLISHABLE_KEY || values.ANON_KEY;
          const secret = values.SERVICE_ROLE_KEY;
          if (!url || !key || !secret) throw new Error("Supabase status omitted a required local key.");
          console.log("::add-mask::" + secret);
          const common = "NEXT_PUBLIC_SUPABASE_URL=" + url + "\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=" + key + "\nNEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000\n";
          writeFileSync(".env.local", common);
          writeFileSync(".env.test.local", common + "SUPABASE_SERVICE_ROLE_KEY=" + secret + "\n");
          NODE
      - run: npm run db:test
      - run: npm run build
      - run: npm run test:e2e:auth
      - name: Stop local test services
        if: always()
        run: npx supabase stop --no-backup
  deploy-preview:
    name: Deploy homepage preview to Cloud Run
    needs: [application, local-auth]
    if: github.event_name == 'push' && github.ref == 'refs/heads/sprint-2/requests-and-messaging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
    steps:
      - name: Check deployment setup
        id: setup
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        shell: bash
        run: |
          if [[ -z "$GCP_SA_KEY" || -z "$GCP_PROJECT_ID" || -z "$GCP_REGION" ]]; then
            printf '%s\n' 'ready=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'Checks passed. Deployment skipped because the Google Cloud secrets are incomplete.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$GCP_PROJECT_ID" != hvac-app-515123 || "$GCP_REGION" != us-central1 ]]; then
            echo "::error::Configure the project and region for the HVAC Connect preview."
            exit 1
          fi
          printf '%s\n' 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        if: steps.setup.outputs.ready == 'true'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
        if: steps.setup.outputs.ready == 'true'
      - name: Build and deploy preview
        if: steps.setup.outputs.ready == 'true'
        shell: bash
        run: |
          gcloud builds submit . \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --config=cloudbuild.yaml \
            --service-account="projects/${GCP_PROJECT_ID}/serviceAccounts/github-actions-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --gcs-source-staging-dir="gs://${GCP_PROJECT_ID}-github-build-source/preview" \
            --substitutions="_DEPLOY_MODE=preview,_SERVICE=hvac-app-preview,_REGION=$GCP_REGION" \
            --suppress-logs --quiet
      - name: Record the deployed service URL
        if: steps.setup.outputs.ready == 'true'
        shell: bash
        run: |
          url=$(gcloud run services describe hvac-app-preview \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(status.url)')
          if [[ "$url" != https://* ]]; then
            echo "::error::Cloud Run did not report a service URL."
            exit 1
          fi
          printf '%s\n' "Preview service: $url" >> "$GITHUB_STEP_SUMMARY"
