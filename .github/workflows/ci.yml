name: Verify HVAC Connect
on:
  push:
    branches: [main, "sprint-*/*"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_local_auth:
        description: Run isolated Docker/Supabase authentication and booking tests
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  local-auth:
    if: github.event_name == 'workflow_dispatch' && inputs.run_local_auth
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local Supabase
        run: |
          npx supabase start > /tmp/hvac-supabase-start.log 2>&1
          npx supabase status -o env > /tmp/hvac-supabase-env
      - name: Configure local test environment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const values = Object.fromEntries(readFileSync("/tmp/hvac-supabase-env", "utf8").split("\n").flatMap(line => {
            const match = line.match(/^([A-Z_]+)="?(.*?)"?$/);
            return match ? [[match[1], match[2]]] : [];
          }));
          const url = values.API_URL;
          const key = values.PUBLISHABLE_KEY || values.ANON_KEY;
          const secret = values.SERVICE_ROLE_KEY;
          if (!url || !key || !secret) throw new Error("Supabase status omitted a required local key.");
          console.log("::add-mask::" + secret);
          const common = "NEXT_PUBLIC_SUPABASE_URL=" + url + "\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=" + key + "\nNEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000\n";
          writeFileSync(".env.local", common);
          writeFileSync(".env.test.local", common + "SUPABASE_SERVICE_ROLE_KEY=" + secret + "\n");
          NODE
      - run: npm run db:test
      - run: npm run build
      - run: npm run test:e2e:auth
      - name: Stop local test services
        if: always()
        run: npx supabase stop --no-backup
