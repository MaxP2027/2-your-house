# Submit with the same region as the Artifact Registry repository and Cloud Run.
substitutions:
  _REGION: us-central1
  _REPOSITORY: hvac-app
  _SERVICE: hvac-app
  _DEPLOY_MODE: full
  _SUPABASE_URL: ""
  _SUPABASE_PUBLISHABLE_KEY: ""
  _SITE_URL: ""

steps:
  - id: validate-deployment
    name: node:22-bookworm-slim
    entrypoint: node
    args:
      - -e
      - |
        const [mode, service, api, key, site] = process.argv.slice(1);
        const httpsOrigin = (value) => {
          try {
            const url = new URL(value);
            return url.protocol === "https:" && url.origin === value
              && /^[a-z0-9.-]+$/i.test(url.hostname) && /[a-z]/i.test(url.hostname)
              && url.hostname.includes(".") && !url.hostname.endsWith(".localhost");
          } catch {
            return false;
          }
        };
        if (mode === "preview") {
          if (!service.endsWith("-preview") || api || key || site) {
            throw new Error("Preview requires a separate -preview service and empty Supabase/site values.");
          }
        } else if (mode !== "full" || !httpsOrigin(api) || !httpsOrigin(site) ||
                   !/^sb_publishable_[A-Za-z0-9_-]+$/.test(key)) {
          throw new Error("Full deployment requires hosted HTTPS origins and a Supabase publishable key.");
        }
      - ${_DEPLOY_MODE}
      - ${_SERVICE}
      - "${_SUPABASE_URL}"
      - "${_SUPABASE_PUBLISHABLE_KEY}"
      - "${_SITE_URL}"
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_SUPABASE_PUBLISHABLE_KEY}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - .
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --port=8080
      - --min-instances=0
      - --max-instances=2
      - --update-env-vars=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_SUPABASE_PUBLISHABLE_KEY},NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
